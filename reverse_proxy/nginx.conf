server {
    listen 443 ssl;
    server_name control_reverse_proxy

    ssl_client_certificate /etc/nginx/certs/ca.crt;  # Trusted CA to verify clients
    ssl_verify_client on;                           # Enforce mTLS (use "optional" for testing)
    ssl_verify_depth 1;                             # Depth of CA chain (1 is fine for self-signed)

    # Proxy to backend
    location / {
        proxy_pass http://localhost:8080;           # Your backend service
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;  # Pass verification status
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;        # Pass client DN
}